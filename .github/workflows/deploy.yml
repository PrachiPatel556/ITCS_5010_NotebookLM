name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hugging-face-space-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Compile application
        run: python -m compileall -q app.py notebooklm scripts tests

      - name: Build Gradio application
        run: python -c "import app; assert app.demo"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check deployment secrets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO_ID: ${{ vars.HF_SPACE_REPO_ID || secrets.HF_SPACE_REPO_ID }}
        run: |
          test -n "$HF_TOKEN" || { echo 'Set the HF_TOKEN GitHub Actions secret.'; exit 1; }
          test -n "$HF_SPACE_REPO_ID" || { echo 'Set the HF_SPACE_REPO_ID GitHub Actions variable.'; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Hugging Face CLI
        run: python -m pip install --disable-pip-version-check "huggingface_hub>=1,<2"

      - name: Sync to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO_ID: ${{ vars.HF_SPACE_REPO_ID || secrets.HF_SPACE_REPO_ID }}
        run: |
          set +e
          upload_output=$(hf upload "$HF_SPACE_REPO_ID" . . \
            --repo-type=space \
            --exclude=".git*" \
            --exclude=".github/*" \
            --exclude="*/.git/*" \
            --exclude="*/.github/*" \
            --delete="*" \
            --commit-message="Deploy ${GITHUB_REPOSITORY}@${GITHUB_SHA}" 2>&1)
          upload_status=$?
          set -e

          safe_output=$(printf '%s\n' "$upload_output" | sed -E 's/hf_[A-Za-z0-9_-]+/[REDACTED]/g')
          printf '%s\n' "$safe_output"
          if [ "$upload_status" -ne 0 ]; then
            annotation=$(printf '%s\n' "$safe_output" | tail -n 12 | tr '\n' ' ' | sed 's/%/%25/g')
            echo "::error title=Hugging Face upload failed::$annotation"
            exit "$upload_status"
          fi
